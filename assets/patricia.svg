<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Patrícia, atendimento da Meu Patrimônio">
  <defs>
    <clipPath id="pat-c"><circle cx="100" cy="100" r="100"/></clipPath>
    <linearGradient id="pat-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef7f0"/><stop offset="1" stop-color="#dcebe0"/>
    </linearGradient>
    <linearGradient id="pat-bl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a5c46"/><stop offset="1" stop-color="#00412f"/>
    </linearGradient>
    <linearGradient id="pat-hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a342a"/><stop offset="1" stop-color="#32221b"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#pat-bg)"/>

  <g clip-path="url(#pat-c)">
    <!-- ombros e blazer -->
    <path d="M100 128c-34 0-54 22-57 58v14h114v-14c-3-36-23-58-57-58z" fill="url(#pat-bl)"/>
    <!-- camisa -->
    <path d="M86 131l14 21 14-21-7-5h-14z" fill="#f4f8f5"/>
    <!-- lapelas -->
    <path d="M86 131l14 21-6 4-16-19z" fill="#00412f" opacity=".55"/>
    <path d="M114 131l-14 21 6 4 16-19z" fill="#00412f" opacity=".55"/>

    <!-- pescoço -->
    <path d="M88 108h24v22c0 7-24 7-24 0z" fill="#e0a87f"/>
    <path d="M88 108h24v9c-7 5-17 5-24 0z" fill="#c88f69" opacity=".55"/>

    <!-- cabelo: massa única que emoldura o rosto e cai sobre o ombro -->
    <path d="M100 38c-29 0-49 21-49 51 0 18 2 34 6 46 2 7 7 9 11 7 3-2 4-6 3-11-4-14-6-28-5-42 1-10 5-19 10-24 11 9 25 13 38 11 9-1 16-4 21-8 6 6 10 15 11 25 1 14-1 28-5 42-1 5 0 9 3 11 4 2 9 0 11-7 4-12 6-28 6-46 0-30-20-51-49-51z" fill="url(#pat-hair)"/>

    <!-- rosto -->
    <ellipse cx="100" cy="88" rx="31" ry="36" fill="#f2c8a2"/>
    <path d="M127 68c5 18 2 37-9 49 12-7 17-21 16-37z" fill="#dda87f" opacity=".45"/>

    <!-- orelhas e brincos -->
    <ellipse cx="70" cy="92" rx="5" ry="8" fill="#eabd94"/>
    <ellipse cx="130" cy="92" rx="5" ry="8" fill="#eabd94"/>
    <circle cx="70" cy="102" r="2.5" fill="#d9b45a"/>
    <circle cx="130" cy="102" r="2.5" fill="#d9b45a"/>

    <!-- franja: linha do cabelo com repartição lateral suave -->
    <path d="M68 82c0-23 14-37 32-37s32 14 32 37c-2-13-6-21-12-25-9 9-28 12-41 6-5 4-9 10-11 19z" fill="url(#pat-hair)"/>

    <!-- sobrancelhas -->
    <path d="M83 79q7-4 14-1" stroke="#4e362a" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M103 78q7-3 14 1" stroke="#4e362a" stroke-width="2.6" fill="none" stroke-linecap="round"/>

    <!-- olhos -->
    <ellipse cx="89" cy="89" rx="6.2" ry="4.4" fill="#fff"/>
    <ellipse cx="111" cy="89" rx="6.2" ry="4.4" fill="#fff"/>
    <circle cx="89.6" cy="89" r="3.3" fill="#52381f"/>
    <circle cx="111.6" cy="89" r="3.3" fill="#52381f"/>
    <circle cx="89.6" cy="89" r="1.5" fill="#20150c"/>
    <circle cx="111.6" cy="89" r="1.5" fill="#20150c"/>
    <circle cx="91.2" cy="87.4" r="1.1" fill="#fff" opacity=".9"/>
    <circle cx="113.2" cy="87.4" r="1.1" fill="#fff" opacity=".9"/>
    <!-- cílios -->
    <path d="M83 86.5q6-4.5 12 0" stroke="#3a2619" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M105 86.5q6-4.5 12 0" stroke="#3a2619" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- nariz -->
    <path d="M100 92v8q0 2.6-3 3.4" stroke="#d2a079" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- boca -->
    <path d="M92 112q8 7 16 0" stroke="#b86a56" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M94 112q6 2.6 12 0" fill="#e08d7c" opacity=".5"/>
    <!-- blush -->
    <ellipse cx="80" cy="100" rx="6.5" ry="4" fill="#e79b86" opacity=".3"/>
    <ellipse cx="120" cy="100" rx="6.5" ry="4" fill="#e79b86" opacity=".3"/>
  </g>
</svg>
